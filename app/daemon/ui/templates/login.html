<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link href="static/login/css/index.css" rel="stylesheet">
</head>

<body>
  <div class="main">
    <div class="content">
      <div class="logo">
        <img src="static/login/images/login.svg" alt="">
        <h1 class="title">Telegram Media Downloader</h1>
        <div class="tips">enter your password.</div>
      </div>
      <div class="password-input">
        <input type="password" class="input-p" placeholder="please enter your password" id="password">
        <div class="tip">Your password</div>
      </div>
      <button class="confirm-btn" onclick="login()">confirm</button>
    </div>
  </div>

  <script src="../static/layui/layui.js"></script>
  <script>
    const $ = layui.$;
    const layer = layui.layer;

    const login = () => {
      const pValue = $('#password').val();

      if (!pValue) {
        layer.msg('Please enter your password!');
        return;
      }

      fetch('login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ password: pValue })
      })
      .then(async (res) => {
        let data = {};
        try {
          data = await res.json();
        } catch (e) {}

        if (!res.ok) {
          layer.msg(data.msg || data.error || 'Password error!');
          $('#password').val('');
          return;
        }

        if (data.ok || data.code === 1 || data.code === '1') {
          window.location.href = './';
        } else {
          layer.msg(data.msg || data.error || 'Password error!');
          $('#password').val('');
        }
      })
      .catch(() => {
        layer.msg('Network request failed');
        $('#password').val('');
      });
    };

    $('#password').on('keydown', function (e) {
      if (e.key === 'Enter') {
        login();
      }
    });
  </script>
</body>

</html>
