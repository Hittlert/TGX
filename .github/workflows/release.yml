name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: tgx-linux-amd64
          - goos: linux
            goarch: arm64
            output: tgx-linux-arm64
          - goos: darwin
            goarch: amd64
            output: tgx-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: tgx-darwin-arm64
          - goos: windows
            goarch: amd64
            output: tgx-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Cross Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X 'github.com/Hittlert/TGX/pkg/consts.Version=${{ github.ref_name }}' -X 'github.com/Hittlert/TGX/pkg/consts.Commit=${{ github.sha }}' -X 'github.com/Hittlert/TGX/pkg/consts.CommitDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" -o dist/${{ matrix.output }} ./main.go

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
