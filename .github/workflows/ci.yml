name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Unit Tests & Chaos Suite
        run: |
          go test -v -race ./pkg/... ./app/... ./core/... ./test/chaos/...

      - name: Build Binary
        run: |
          go build -v -ldflags="-s -w" -o tgx ./main.go
