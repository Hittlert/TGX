name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run Tests
        run: |
          go test -v -race ./pkg/... ./app/... ./test/chaos/...

      - name: Validate Evaluation Tools
        run: |
          python3 scripts/evaluation/run_protocol_v1.py self-test

      - name: Build Binary
        run: |
          go build -v -ldflags="-s -w" -o tgx ./main.go
