<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Media Downloader</title>
  <link href="static/layui/css/layui.css" rel="stylesheet">
  <link href="static/css/index.css" rel="stylesheet">
</head>

<body>
  <div class="layui-tab" lay-filter="telegram_media_downloader">
    <div class="header-title layui-tab-brief">
      <ul class="layui-tab-title">
        <li class="layui-this">Downloading</li>
        <li>Downloaded</li>
        <li>Targets</li>
      </ul>
      <div class="stop-btn" id="download_state" data-value="{{ download_state }}" onclick="download_state_change(this)"> {{ download_state }} </div>
    </div>
    <div class="layui-tab-content" style="padding: 0;">
      <div class="layui-tab-item layui-show">
        <div class="mobile-job-list" id="download_mobile_list">
          <div class="mobile-empty">No active downloads</div>
        </div>
        <table class="layui-hide" id="download_list" lay-filter="download_list"></table>
      </div>
      <div class="layui-tab-item">
        <div class="mobile-job-list" id="already_download_mobile_list">
          <div class="mobile-empty">No downloaded files</div>
        </div>
        <table class="layui-hide" id="already_download_list" lay-filter="already_download_list"></table>
      </div>
      <div class="layui-tab-item">
        <div class="target-toolbar">
          <div class="target-search">
            <i class="layui-icon layui-icon-search"></i>
            <input id="target_search" type="text" autocomplete="off" placeholder="Search dialogs">
          </div>
          <button id="add_target_btn" type="button" class="layui-btn layui-btn-warm layui-btn-sm" aria-label="Add target">
            <i class="layui-icon layui-icon-add-1"></i>
            <span class="target-action-text">Add</span>
          </button>
          <button id="reload_dialogs" type="button" class="layui-btn layui-btn-primary layui-btn-sm" aria-label="Refresh dialogs">
            <i class="layui-icon layui-icon-refresh"></i>
            <span class="target-action-text">Refresh</span>
          </button>
          <button id="save_targets" type="button" class="layui-btn layui-btn-sm" aria-label="Save targets">
            <i class="layui-icon layui-icon-ok"></i>
            <span class="target-action-text">Save</span>
          </button>
          <div class="target-count">
            <span id="target_enabled_count">0</span>/<span id="target_total_count">0</span>
          </div>
        </div>
        <div class="target-list" id="target_list">
          <div class="target-empty">Loading cache...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="layui-footer">
    <div class="footer-content">
      <div class="footer-product">
        Telegram Media Downloader V <b id="app_version">undefined</b>
      </div>
      <div class="footer-runtime">
        <span class="footer-speed">
          <i class="layui-icon layui-icon-download-circle" aria-hidden="true"></i>
          <span id="download_speed_title">0.00 B/s</span>
        </span>
        <span id="media_pool_status" class="media-pool-status">Pool off</span>
      </div>
    </div>
  </div>

  <script src="static/layui/layui.js"></script>
  <script>

    layui.use(['table', 'element'], function () {
      var table = layui.table;
      var element = layui.element;
      var layer = layui.layer;
      var $ = layui.$;
      var already_download_list_data = new Array()
      var download_list_table_data = new Array()

      $.ajax({
        url: "get_app_version"
        , type: "get"
        , async: false
        , dataType: "text"
        , success: function (result) {
          $("#app_version").html(result)
        }
      });

      download_state_change = function(e) {
        $.ajax({
        url: "set_download_state?state=" + e.dataset.value
        , type: "post"
        , async: false
        , dataType: "text"
        , success: function (result) {
          $("#download_state").html(result)
          e.dataset.value=result
        }
      });
    }

      var target_rows = [];
      var target_loaded = false;
      var target_progress_by_chat = {};
      var target_progress_loading = false;
      var target_progress_has_snapshot = false;
      var target_progress_unavailable = false;
      var target_progress_poll_int = 0;
      var TARGET_PROGRESS_POLL_INTERVAL = 10000;

      function escape_html(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function target_key(value) {
        return String(value == null ? '' : value);
      }

      function find_target_row(chat_key) {
        for (var i = 0; i < target_rows.length; i++) {
          if (target_key(target_rows[i].chat_id) == chat_key) {
            return target_rows[i];
          }
        }
        return null;
      }

      function target_display_name(row) {
        if (row.title) {
          return row.title;
        }
        if (row.username) {
          return '@' + row.username;
        }
        if (row.chat_id) {
          return row.chat_id;
        }
        return 'Unknown dialog';
      }

      function target_meta(row) {
        var parts = [];
        if (row.type) {
          parts.push(row.type);
        }
        if (row.username) {
          parts.push('@' + row.username);
        }
        if (row.chat_id) {
          parts.push('id ' + row.chat_id);
        }
        var listen_chat_id = normalized_listen_chat_id(row);
        if (listen_chat_id && String(listen_chat_id) != String(row.chat_id || '')) {
          parts.push('listen ' + listen_chat_id);
        }
        return parts.join(' / ');
      }

      function normalized_listen_chat_id(row) {
        var chat_type = String(row.type || '').toLowerCase();
        var username = String(row.username || '').replace(/^@/, '');
        if (username && (chat_type == 'bot' || chat_type == 'private' || chat_type == 'user')) {
          return '@' + username;
        }

        var chat_id = row.chat_id;
        var chat_id_text = String(chat_id == null ? '' : chat_id);
        if (
          chat_id_text &&
          chat_id_text.indexOf('-') !== 0 &&
          /^\d+$/.test(chat_id_text) &&
          (chat_type == 'channel' || chat_type == 'supergroup')
        ) {
          return '-100' + chat_id_text;
        }

        if (row.target_chat_id) {
          return row.target_chat_id;
        }

        return chat_id;
      }

      function format_timestamp(value) {
        var timestamp = parseInt(value || 0, 10);
        if (!timestamp) {
          return 'Never';
        }

        var date = new Date(timestamp * 1000);
        var pad = function (number) {
          return number < 10 ? '0' + number : String(number);
        };
        return [
          date.getFullYear(),
          pad(date.getMonth() + 1),
          pad(date.getDate())
        ].join('-') + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
      }

      function get_scan_status(row) {
        if (!row.scan_status || typeof row.scan_status != 'object') {
          return {};
        }
        return row.scan_status;
      }

      function scan_status_label(status) {
        if (status == 'ok') {
          return 'OK';
        }
        if (status == 'error') {
          return 'Error';
        }
        if (status == 'scanning') {
          return 'Scanning';
        }
        return 'Pending';
      }

      function scan_status_class(status) {
        if (status == 'ok' || status == 'error' || status == 'scanning') {
          return status;
        }
        return 'pending';
      }

      function target_scan_html(row) {
        var scan = get_scan_status(row);
        var status = scan.status || 'pending';
        var scan_time = scan.last_scan_finished_at || scan.last_scan_started_at || 0;
        var time_label = status == 'scanning' ? 'Started ' : 'Last scan ';
        var error = scan.error
          ? '<div class="target-scan-error">' + escape_html(scan.error) + '</div>'
          : '';

        return '<div class="target-scan">' +
          '<span class="target-status-badge is-' + scan_status_class(status) + '">' + scan_status_label(status) + '</span>' +
          '<span class="target-scan-time">' + time_label + format_timestamp(scan_time) + '</span>' +
          '</div>' + error;
      }

      function sync_target_row(dom_row) {
        var row = find_target_row($(dom_row).attr('data-chat-key'));
        if (!row) {
          return;
        }
        row.enabled = $(dom_row).find('.target-enabled').prop('checked');
        row.priority = parseInt($(dom_row).find('.target-priority').val() || 0, 10) || 0;
        row.last_read_message_id = $(dom_row).find('.target-cursor').val() || 0;
        row.download_filter = $(dom_row).find('.target-filter').val() || '';
      }

      function sync_visible_target_rows() {
        $('#target_list .target-item[data-chat-key]').each(function () {
          sync_target_row(this);
        });
      }

      function update_target_count() {
        var enabled_count = 0;
        for (var i = 0; i < target_rows.length; i++) {
          if (target_rows[i].enabled) {
            enabled_count += 1;
          }
        }
        $('#target_enabled_count').html(enabled_count);
        $('#target_total_count').html(target_rows.length);
      }

      function nonnegative_integer(value) {
        var number = parseInt(value || 0, 10);
        if (isNaN(number) || number < 0) {
          return 0;
        }
        return number;
      }

      function format_file_count(value) {
        return String(nonnegative_integer(value)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }

      function format_downloaded_bytes(value) {
        var bytes = nonnegative_integer(value);
        var units = ['B', 'KB', 'MB', 'GB', 'TB'];
        var index = 0;
        var size = bytes;
        while (size >= 1024 && index < units.length - 1) {
          size /= 1024;
          index += 1;
        }
        var precision = index == 0 || size >= 100 ? 0 : 1;
        return size.toFixed(precision) + ' ' + units[index];
      }

      function target_progress_key(row) {
        return target_key(row.target_chat_id || row.chat_id);
      }

      function normalize_target_progress(item) {
        return {
          chat_id: target_key(item.chat_id),
          total_files: nonnegative_integer(item.total_files),
          downloaded_files: nonnegative_integer(item.downloaded_files),
          pending_files: nonnegative_integer(item.pending_files),
          processing_files: nonnegative_integer(item.processing_files),
          failed_files: nonnegative_integer(item.failed_files),
          downloaded_bytes: nonnegative_integer(item.downloaded_bytes)
        };
      }

      function target_progress_content(progress) {
        if (!progress) {
          return '<div class="target-progress-empty">' +
            (target_progress_unavailable ? 'Progress unavailable' : 'Loading progress...') +
            '</div>';
        }
        var total = progress.total_files;
        if (!total) {
          return '<div class="target-progress-empty">No indexed files</div>';
        }
        var downloaded = Math.min(progress.downloaded_files, total);
        var percent = Math.max(0, Math.min(100, downloaded / total * 100));
        var percent_text = percent.toFixed(1) + '%';
        var failed = progress.failed_files
          ? '<span class="target-progress-failed">Failed ' + format_file_count(progress.failed_files) + '</span>'
          : '<span>Failed 0</span>';
        return '<div class="target-progress-summary">' +
          '<span><b>Downloaded ' + format_file_count(downloaded) + '</b> / ' + format_file_count(total) + ' files</span>' +
          '<span>' + percent_text + '</span>' +
          '</div>' +
          '<div class="target-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + percent.toFixed(1) + '">' +
          '<div style="width: ' + percent.toFixed(1) + '%;"></div>' +
          '</div>' +
          '<div class="target-progress-detail">' +
          '<span>Pending ' + format_file_count(progress.pending_files) + '</span>' +
          '<span>Processing ' + format_file_count(progress.processing_files) + '</span>' +
          failed +
          '<span>Downloaded ' + format_downloaded_bytes(progress.downloaded_bytes) + '</span>' +
          '</div>';
      }

      function target_progress_html(row) {
        if (!row.enabled) {
          return '';
        }
        var progress_key = target_progress_key(row);
        return '<div class="target-progress" data-progress-key="' + escape_html(progress_key) + '">' +
          target_progress_content(target_progress_by_chat[progress_key]) +
          '</div>';
      }

      function update_target_progress_nodes() {
        $('#target_list .target-progress[data-progress-key]').each(function () {
          var progress_key = $(this).attr('data-progress-key');
          $(this).html(target_progress_content(target_progress_by_chat[progress_key]));
        });
      }

      function load_target_progress() {
        if (!target_loaded || target_progress_loading) {
          return;
        }
        target_progress_loading = true;
        $.ajax({
          url: "api/target_progress",
          type: "get",
          dataType: "json",
          success: function (result) {
            if (!result.ok || !Array.isArray(result.progress)) {
              return;
            }
            var next_progress = {};
            for (var i = 0; i < result.progress.length; i++) {
              if (!result.progress[i] || typeof result.progress[i] != 'object') {
                continue;
              }
              var progress = normalize_target_progress(result.progress[i]);
              if (progress.chat_id) {
                next_progress[progress.chat_id] = progress;
              }
            }
            target_progress_by_chat = next_progress;
            target_progress_has_snapshot = true;
            target_progress_unavailable = false;
            update_target_progress_nodes();
          },
          error: function () {
            if (!target_progress_has_snapshot) {
              target_progress_unavailable = true;
              update_target_progress_nodes();
            }
          },
          complete: function () {
            target_progress_loading = false;
          }
        });
      }

      function stop_target_progress_poll() {
        clearInterval(target_progress_poll_int);
        target_progress_poll_int = 0;
      }

      function start_target_progress_poll() {
        stop_target_progress_poll();
        load_target_progress();
        target_progress_poll_int = self.setInterval(function () {
          if ($('#target_list').is(':visible')) {
            load_target_progress();
          }
        }, TARGET_PROGRESS_POLL_INTERVAL);
      }

      function clamp_progress(value) {
        var progress = parseFloat(value || 0);
        if (isNaN(progress)) {
          progress = 0;
        }
        return Math.max(0, Math.min(100, progress));
      }

      function render_file_card(row, done) {
        var filename = row.filename || row.save_path || ('Message ' + (row.id || ''));
        var progress = clamp_progress(row.download_progress);
        var meta = [];
        if (row.chat) {
          meta.push('chat ' + row.chat);
        }
        if (row.id) {
          meta.push('msg ' + row.id);
        }
        if (row.total_size) {
          meta.push(row.total_size);
        }
        var path = done && row.save_path
          ? '<div class="mobile-job-path">' + escape_html(row.save_path) + '</div>'
          : '';
        var progress_html = done
          ? '<span class="mobile-job-badge">Done</span>'
          : '<div class="mobile-progress"><div style="width: ' + progress + '%;"></div></div>';
        var status = done ? '' : '<div class="mobile-job-speed">' + escape_html(row.download_speed || '') + '</div>';

        return '<section class="mobile-job-card">' +
          '<div class="mobile-job-main">' +
          '<div class="mobile-job-file">' + escape_html(filename) + '</div>' +
          '<div class="mobile-job-meta">' + escape_html(meta.join(' / ')) + '</div>' +
          path +
          '</div>' +
          '<div class="mobile-job-side">' +
          progress_html +
          status +
          '</div>' +
          '</section>';
      }

      function render_active_download_cards(rows) {
        var html = '';
        for (var i = 0; i < rows.length; i++) {
          if (clamp_progress(rows[i].download_progress) >= 100) {
            continue;
          }
          html += render_file_card(rows[i], false);
        }
        $('#download_mobile_list').html(html || '<div class="mobile-empty">No active downloads</div>');
      }

      function render_downloaded_cards(rows) {
        var html = '';
        for (var i = 0; i < rows.length; i++) {
          html += render_file_card(rows[i], true);
        }
        $('#already_download_mobile_list').html(html || '<div class="mobile-empty">No downloaded files</div>');
      }

      function render_target_list() {
        var query = ($('#target_search').val() || '').toLowerCase();
        var html = '';
        var shown_count = 0;

        for (var i = 0; i < target_rows.length; i++) {
          var row = target_rows[i];
          var scan_status = get_scan_status(row);
          var search_text = [
            row.chat_id,
            row.title,
            row.username,
            row.type,
            scan_status.status,
            scan_status.error
          ].join(' ').toLowerCase();
          if (query && search_text.indexOf(query) < 0) {
            continue;
          }

          shown_count += 1;
          var chat_key = escape_html(target_key(row.chat_id));
          var checked = row.enabled ? 'checked' : '';
          var config_open = row.config_open ? ' is-config-open' : '';
          var top_message_id = parseInt(row.top_message_id || 0, 10);
          var latest_button = top_message_id > 0
            ? '<button type="button" class="target-icon-btn cursor-latest" title="Use latest message id" aria-label="Use latest message id"><i class="layui-icon layui-icon-set"></i></button>'
            : '';
          html += '<section class="target-item' + (row.enabled ? ' is-enabled' : '') + config_open + '" data-chat-key="' + chat_key + '">' +
            '<div class="target-item-head">' +
            '<label class="target-listen"><input class="target-enabled" type="checkbox" ' + checked + '><span>Listen</span></label>' +
            '<div class="target-identity"><div class="target-name">' + escape_html(target_display_name(row)) + '</div>' +
            '<div class="target-meta">' + escape_html(target_meta(row)) + '</div>' +
            target_scan_html(row) + '</div>' +
            '<div class="target-actions">' +
            '<button type="button" class="target-context-toggle" title="View message context around ID" aria-label="View message context"><i class="layui-icon layui-icon-dialogue"></i><span class="target-action-text">Context</span></button>' +
            '<button type="button" class="target-config-toggle" title="Configure priority, cursor and filter" aria-label="Configure priority, cursor and filter" aria-expanded="' + (row.config_open ? 'true' : 'false') + '"><i class="layui-icon layui-icon-set"></i><span class="target-action-text">Config</span></button>' +
            '</div>' +
            '</div>' +
            target_progress_html(row) +
            '<div class="target-controls">' +
            '<label class="target-field"><span>Priority</span><input class="target-priority" type="number" min="-1000000" max="1000000" step="1" value="' + escape_html(row.priority || 0) + '"></label>' +
            '<label class="target-field"><span>Cursor</span><div class="target-cursor-cell"><input class="target-cursor" type="number" min="0" step="1" value="' + escape_html(row.last_read_message_id || 0) + '">' + latest_button + '</div></label>' +
            '<label class="target-field"><span>Filter</span><input class="target-filter" type="text" value="' + escape_html(row.download_filter || '') + '" placeholder="download_filter"></label>' +
            '</div>' +
            '</section>';
        }

        if (!shown_count) {
          html = '<div class="target-empty">No dialogs</div>';
        }

        $('#target_list').html(html);
        update_target_count();
      }

      function load_dialogs(refresh) {
        var loading_text = refresh ? 'Refreshing...' : 'Loading cache...';
        $('#target_list').html('<div class="target-empty">' + loading_text + '</div>');
        $.ajax({
          url: refresh ? "api/dialogs?refresh=true" : "api/dialogs",
          type: "get",
          dataType: "json",
          success: function (result) {
            if (!result.ok) {
              layer.msg(result.error || 'Load failed');
              return;
            }
            target_rows = result.dialogs || [];
            target_rows.sort(function (a, b) {
              var enabled_order = Number(Boolean(b.enabled)) - Number(Boolean(a.enabled));
              if (enabled_order) {
                return enabled_order;
              }
              return (parseInt(b.priority || 0, 10) || 0) - (parseInt(a.priority || 0, 10) || 0);
            });
            target_loaded = true;
            render_target_list();
            load_target_progress();
          },
          error: function (err) {
            var message = 'Load failed';
            if (err.responseJSON && err.responseJSON.error) {
              message = err.responseJSON.error;
            } else if (err.responseText) {
              try {
                var parsed = JSON.parse(err.responseText);
                if (parsed && parsed.error) message = parsed.error;
              } catch (e) {
                message = 'Load error (' + err.status + ')';
              }
            }
            layer.msg(message);
            $('#target_list').html('<div class="target-empty">Load failed</div>');
          }
        });
      }

      function add_target() {
        layer.prompt({
          title: 'Add Monitored Group / Channel (Chat ID, @username or t.me link)',
          formType: 0,
          placeholder: '@channel or -100123456789 or https://t.me/...'
        }, function (value, index) {
          var trimmed = $.trim(value);
          if (!trimmed) {
            return;
          }
          layer.close(index);
          var loadIndex = layer.load(2);
          $.ajax({
            url: "api/add_target",
            type: "post",
            dataType: "json",
            contentType: "application/json",
            data: JSON.stringify({ query: trimmed }),
            success: function (result) {
              layer.close(loadIndex);
              if (!result.ok || !result.dialog) {
                layer.msg(result.error || 'Failed to find chat');
                return;
              }
              var dialog = result.dialog;
              dialog.enabled = true;
              dialog.priority = 0;
              dialog.last_read_message_id = dialog.top_message_id || 0;
              dialog.download_filter = '';
              dialog.upload_telegram_chat_id = '';
              dialog.scan_status = {};

              var existing = find_target_row(target_key(dialog.chat_id));
              if (existing) {
                existing.enabled = true;
              } else {
                target_rows.unshift(dialog);
              }
              render_target_list();
              save_targets();
            },
            error: function (err) {
              layer.close(loadIndex);
              var message = 'Failed to add target';
              if (err.responseJSON && err.responseJSON.error) {
                message = err.responseJSON.error;
              } else if (err.responseText) {
                try {
                  var parsed = JSON.parse(err.responseText);
                  if (parsed && parsed.error) message = parsed.error;
                } catch (e) {
                  message = 'Add target error (' + err.status + ')';
                }
              }
              layer.msg(message);
            }
          });
        });
      }

      function save_targets() {
        sync_visible_target_rows();
        var targets = [];
        for (var i = 0; i < target_rows.length; i++) {
          if (!target_rows[i].enabled) {
            continue;
          }
          targets.push({
            enabled: true,
            chat_id: normalized_listen_chat_id(target_rows[i]),
            source_chat_id: target_rows[i].chat_id,
            title: target_display_name(target_rows[i]),
            username: target_rows[i].username || '',
            type: target_rows[i].type || '',
            priority: parseInt(target_rows[i].priority || 0, 10) || 0,
            _priority_dirty: Boolean(target_rows[i]._priority_dirty),
            _cursor_dirty: Boolean(target_rows[i]._cursor_dirty),
            _filter_dirty: Boolean(target_rows[i]._filter_dirty),
            last_read_message_id: parseInt(target_rows[i].last_read_message_id || 0, 10) || 0,
            download_filter: target_rows[i].download_filter || '',
            upload_telegram_chat_id: target_rows[i].upload_telegram_chat_id || ''
          });
        }

        $.ajax({
          url: "api/listen_targets",
          type: "post",
          dataType: "json",
          contentType: "application/json",
          data: JSON.stringify({ targets: targets }),
          success: function (result) {
            if (!result.ok) {
              layer.msg(result.error || 'Save failed');
              return;
            }
            layer.msg('Saved');
            load_dialogs(false);
          },
          error: function (err) {
            var message = 'Save failed';
            if (err.responseJSON && err.responseJSON.error) {
              message = err.responseJSON.error;
            } else if (err.responseText) {
              try {
                var parsed = JSON.parse(err.responseText);
                if (parsed && parsed.error) message = parsed.error;
              } catch (e) {
                message = 'Save error (' + err.status + ')';
              }
            }
            layer.msg(message);
          }
        });
      }

      $('#target_search').on('input', function () {
        sync_visible_target_rows();
        render_target_list();
      });

      $('#add_target_btn').on('click', function () {
        add_target();
      });

      $('#reload_dialogs').on('click', function () {
        load_dialogs(true);
      });

      $('#save_targets').on('click', function () {
        save_targets();
      });

      $('#target_list').on('change', '.target-enabled', function () {
        var item = $(this).closest('.target-item');
        sync_target_row(item);
        item.toggleClass('is-enabled', $(this).prop('checked'));
        update_target_count();
      });

      $('#target_list').on('input', '.target-priority, .target-cursor, .target-filter', function () {
        var row_el = $(this).closest('.target-item');
        var row = find_target_row(row_el.attr('data-chat-key'));
        sync_target_row(row_el);
        if (!row) {
          return;
        }
        if ($(this).hasClass('target-priority')) {
          row._priority_dirty = true;
        } else if ($(this).hasClass('target-cursor')) {
          row._cursor_dirty = true;
        } else if ($(this).hasClass('target-filter')) {
          row._filter_dirty = true;
        }
      });

      function format_timestamp(ts) {
        if (!ts) return '';
        var date = new Date(ts * 1000);
        return date.getFullYear() + '-' +
          ('0' + (date.getMonth() + 1)).slice(-2) + '-' +
          ('0' + date.getDate()).slice(-2) + ' ' +
          ('0' + date.getHours()).slice(-2) + ':' +
          ('0' + date.getMinutes()).slice(-2) + ':' +
          ('0' + date.getSeconds()).slice(-2);
      }

      function open_context_viewer(chat_id, target_title, initial_message_id) {
        var default_id = parseInt(initial_message_id || 0, 10) || 1;
        var modal_html = '<div class="context-viewer-wrap">' +
          '<div class="context-viewer-bar">' +
          '  <div class="context-input-box">' +
          '    <span>Message ID:</span>' +
          '    <input id="context_msg_id_input" type="number" min="1" step="1" value="' + default_id + '">' +
          '    <button id="context_fetch_btn" type="button" class="layui-btn layui-btn-normal layui-btn-sm"><i class="layui-icon layui-icon-search"></i> Search</button>' +
          '  </div>' +
          '  <div class="context-nav-box">' +
          '    <button id="context_prev_btn" type="button" class="layui-btn layui-btn-primary layui-btn-sm"><i class="layui-icon layui-icon-prev"></i> Prev 15</button>' +
          '    <button id="context_next_btn" type="button" class="layui-btn layui-btn-primary layui-btn-sm">Next 15 <i class="layui-icon layui-icon-next"></i></button>' +
          '  </div>' +
          '</div>' +
          '<div id="context_message_list" class="context-message-list">' +
          '  <div class="context-loading"><i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> Loading context messages...</div>' +
          '</div>' +
          '</div>';

        layer.open({
          type: 1,
          title: '💬 Message Context - ' + escape_html(target_title || chat_id) + ' (' + escape_html(chat_id) + ')',
          area: ['860px', '75%'],
          maxmin: true,
          content: modal_html,
          success: function (layero, index) {
            function load_context(mid) {
              var target_mid = parseInt(mid, 10) || 1;
              $('#context_msg_id_input').val(target_mid);
              $('#context_message_list').html('<div class="context-loading"><i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> Loading context for message #' + target_mid + '...</div>');
              $.ajax({
                url: 'api/chat_context?chat_id=' + encodeURIComponent(chat_id) + '&message_id=' + target_mid + '&limit_before=15&limit_after=15',
                type: 'get',
                dataType: 'json',
                success: function (res) {
                  if (!res.ok) {
                    $('#context_message_list').html('<div class="context-empty">Error: ' + escape_html(res.error || 'Failed to load context') + '</div>');
                    return;
                  }
                  var msgs = res.messages || [];
                  if (!msgs.length) {
                    $('#context_message_list').html('<div class="context-empty">No messages found around ID #' + target_mid + '</div>');
                    return;
                  }
                  var list_html = '';
                  for (var i = 0; i < msgs.length; i++) {
                    var m = msgs[i];
                    var is_target = (parseInt(m.message_id, 10) === target_mid);
                    var sender = escape_html(m.sender_name || m.sender_id || 'Unknown');
                    var date_str = format_timestamp(m.date || m.created_at);
                    var media_type = m.media_type && m.media_type !== 'text' ? '<span class="context-media-tag">[' + escape_html(m.media_type) + ']</span> ' : '';
                    var text_content = escape_html(m.text || '').replace(/\n/g, '<br>');
                    var reply_html = m.reply_to_message_id ? '<span class="context-reply-tag" data-mid="' + m.reply_to_message_id + '">↳ Reply to #' + m.reply_to_message_id + '</span>' : '';
                    var target_badge = is_target ? '<span class="context-target-badge"><i class="layui-icon layui-icon-star-fill"></i> Target Message</span>' : '';

                    list_html += '<div class="context-msg-item' + (is_target ? ' is-target' : '') + '" id="ctx_msg_' + m.message_id + '">' +
                      '<div class="context-msg-meta">' +
                      '  <span class="context-mid-badge" data-mid="' + m.message_id + '">#' + m.message_id + '</span>' +
                      '  <span class="context-sender">' + sender + '</span>' +
                      '  <span class="context-time">' + date_str + '</span>' +
                      reply_html +
                      target_badge +
                      '</div>' +
                      '<div class="context-msg-body">' + media_type + (text_content || '<i class="context-no-text">&lt;Empty Text / Media Only&gt;</i>') + '</div>' +
                      '</div>';
                  }
                  $('#context_message_list').html(list_html);
                  var target_el = document.getElementById('ctx_msg_' + target_mid);
                  if (target_el) {
                    target_el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  }
                },
                error: function (err) {
                  var message = 'Failed to load context';
                  if (err.responseJSON && err.responseJSON.error) {
                    message = err.responseJSON.error;
                  }
                  $('#context_message_list').html('<div class="context-empty">' + escape_html(message) + '</div>');
                }
              });
            }

            load_context(default_id);

            $('#context_fetch_btn').on('click', function () {
              var val = $('#context_msg_id_input').val();
              load_context(val);
            });

            $('#context_msg_id_input').on('keydown', function (e) {
              if (e.keyCode === 13) {
                load_context($(this).val());
              }
            });

            $('#context_prev_btn').on('click', function () {
              var cur = parseInt($('#context_msg_id_input').val(), 10) || 1;
              load_context(Math.max(1, cur - 15));
            });

            $('#context_next_btn').on('click', function () {
              var cur = parseInt($('#context_msg_id_input').val(), 10) || 1;
              load_context(cur + 15);
            });

            $('#context_message_list').on('click', '.context-mid-badge, .context-reply-tag', function () {
              var mid = $(this).attr('data-mid');
              if (mid) {
                load_context(mid);
              }
            });
          }
        });
      }

      $('#target_list').on('click', '.target-context-toggle', function () {
        var row_el = $(this).closest('.target-item');
        var row = find_target_row(row_el.attr('data-chat-key'));
        if (!row) {
          return;
        }
        var initial_id = row.last_read_message_id || row.top_message_id || 1;
        open_context_viewer(row.chat_id, target_display_name(row), initial_id);
      });

      $('#target_list').on('click', '.target-config-toggle', function () {
        var row_el = $(this).closest('.target-item');
        var row = find_target_row(row_el.attr('data-chat-key'));
        if (!row) {
          return;
        }
        sync_target_row(row_el);
        row.config_open = !row.config_open;
        row_el.toggleClass('is-config-open', row.config_open);
        $(this).attr('aria-expanded', row.config_open ? 'true' : 'false');
      });

      $('#target_list').on('click', '.cursor-latest', function () {
        var row_el = $(this).closest('.target-item');
        var row = find_target_row(row_el.attr('data-chat-key'));
        if (!row) {
          return;
        }
        row.last_read_message_id = row.top_message_id || 0;
        row._cursor_dirty = true;
        row_el.find('.target-cursor').val(row.last_read_message_id);
      });

      tableIns = table.render({
        elem: '#download_list'
        , data: download_list_table_data
        , title: 'download_list'
        , height: 'full-160'
        , limit: 10000
        , cols: [[
          { field: 'chat', title: 'chat', width: 100 },
          { field: 'id', title: 'id', width: 100 }
          , { field: 'filename', title: 'file name', align: 'center' }
          , { field: 'total_size', title: 'total byte', align: 'center' }
          , {
            field: 'download_progress', title: 'download progress', align: 'center', templet: function (d) {
              var ys = '';
              if (30 < d.download_progress && d.download_progress < 100) {
                ys = 'layui-bg-blue'
              } else if (0 < d.download_progress && d.download_progress <= 30) {
                ys = 'layui-bg-red'
              }
              else if (100 == d.download_progress) {
                ys = 'layui-bg-green'
              }
              return '<div class="layui-progress layui-progress-big" lay-showpercent="true"  lay-filter="down-' + d.id + '"><div class="layui-progress-bar ' + ys + '" lay-percent="' + d.download_progress + '%"></div></div>'
            }
          }
          , { field: 'download_speed', title: 'download speed', align: 'center' }
        ]]
        , done: function (res, currentCount) {
          element.render()
        }
      });

      table.render({
        elem: '#already_download_list'
        , data: already_download_list_data
        , title: 'already_download_list'
        , height: 'full-160'
        , limit: 10000
        , cols: [[

          { field: 'id', title: 'id', width: 100 }
          , { field: 'filename', title: 'file name', align: 'center' }
          , { field: 'total_size', title: 'total size', align: 'center' }
          , { field: 'save_path', title: 'save path', align: 'center' }
        ]], done: function (res, currentCount) {
          element.render()
        }
      });

      function update_download_list() {
        $.ajax({
          url: "get_download_list?already_down=false"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            render_active_download_cards(result);
            var active_keys = {};
            for (var i = 0, len = result.length; i < len; i++) {
              active_keys[result[i].chat + '-' + result[i].id] = true;
            }
            for (var j = download_list_table_data.length - 1; j >= 0; j--) {
              var row_key = download_list_table_data[j].chat + '-' + download_list_table_data[j].id;
              if (!active_keys[row_key]) {
                $('div[lay-id="download_list"]  tr[data-index="' + row_key + '"]').remove();
                download_list_table_data.splice(j, 1);
              }
            }
            // first remove finish and update
            for (var j = 0, len2 = download_list_table_data.length; j < len2; j++) {
              find_iter = false
              for (var i = 0, len = result.length; i < len; i++) {
                if (result[i].chat == download_list_table_data[j].chat && result[i].id == download_list_table_data[j].id) {
                  download_list_table_data[j].download_progress = result[i].download_progress
                  var progress = download_list_table_data[j].download_progress
                  element.progress('down-' + result[i].chat + '-' + result[i].id, progress + '%');

                  var download_speed_obj = $('div[lay-filter="down_speed-' + result[i].chat + '-' + result[i].id + '"]')
                  download_speed_obj.html(result[i].download_speed)

                  if (progress == 100) {
                    var device_obj = $('div[lay-filter="down-' + result[i].chat + '-' + result[i].id + '"] div')
                    device_obj.removeClass("layui-bg-blue")
                    device_obj.addClass("layui-bg-green")
                    obj = $('div[lay-id="download_list"]  tr[data-index="' + result[i].chat + '-' + result[i].id + '"]')
                    obj.remove()
                  }
                  find_iter = true
                  break
                }
              }

            }

            // new task
            for (var i = 0, len = result.length; i < len; i++) {
              find_iter = false
              for (var j = 0, len2 = download_list_table_data.length; j < len2; j++) {
                if (result[i].chat == download_list_table_data[j].chat && result[i].id == download_list_table_data[j].id) {
                  find_iter = true
                  break
                }
              }

              if (find_iter || result[i].download_progress == 100) {
                continue;
              }
              // not found
              obj = $('div[lay-id="download_list"]  .layui-table-body .layui-table tbody')
              var tr = ' <tr data-index="' + result[i].chat + '-' + result[i].id + '">' +
                '<td data-field="id" data-key="1-0-0" class=""><div class="layui-table-cell laytable-cell-1-0-0">' + result[i].chat + '</div></td>' +
                '<td data-field="id" data-key="1-0-1" class=""><div class="layui-table-cell laytable-cell-1-0-1">' + result[i].id + '</div></td>' +
                '<td data-field="filename" data-key="1-0-2" class=""><div class="layui-table-cell laytable-cell-1-0-2" align="center">' + result[i].filename + '</div></td>' +
                '<td data-field="total_size" data-key="1-0-3" class=""><div class="layui-table-cell laytable-cell-1-0-3" align="center">' + result[i].total_size + '</div></td>' +
                '<td data-field="download_progress" data-key="1-0-4" data-content="' + result[i].download_progress + '" class=""><div class="layui-table-cell laytable-cell-1-0-4" align="center"><div class="layui-progress layui-progress-big" lay-showpercent="true" lay-filter="down-' + result[i].chat + '-' + result[i].id + '"><div class="layui-progress-bar layui-bg-blue" lay-percent="' + result[i].download_progress + '%" style="width: ' + result[i].download_progress + '%;"><span class="layui-progress-text">' + result[i].download_progress + '%</span></div></div></div></td>' +
                '<td data-field="download_speed" data-key="1-0-5" class=""><div class="layui-table-cell laytable-cell-1-0-5" align="center"lay-filter="down_speed-' + result[i].chat + '-' + result[i].id + '">' + result[i].download_speed + '</div></td>' +
                "  </tr>";
              obj.append(tr)
              download_list_table_data.push(result[i])

              if (download_list_table_data.length == 1) {
                $(".layui-none").remove()
              }

              element.render()

            }

            element.render()
          }
        });

      };


      function update_download_status() {
        $.ajax({
          url: "get_download_status"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            $("#download_speed_title").html(result.download_speed)
            var pool = result.media_pool || {};
            var poolText = 'Pool off';
            if (pool.enabled && pool.mode == 'per_file') {
              poolText = 'Pools ' + (pool.active_files || 0) + '/5 - Sessions ' + (pool.used || 0) + '/' + (pool.hard_limit || 60);
            } else if (pool.enabled) {
              poolText = 'Pool ' + (pool.live || 0) + '/' + (pool.hard_limit || 48) + ' - ' + (pool.active_slots || 0) + ' active';
            }
            $('#media_pool_status').text(poolText);
          }
        });

      };


      var update_download_list_int = self.setInterval(update_download_list, 1000);
      var update_download_status_int = self.setInterval(update_download_status, 1000);
      var update_already_download_list_int = 0;


      function update_already_download_list() {
        $.ajax({
          url: "get_download_list?already_down=true"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            // if not exist then add
            for (var i = 0, len = result.length; i < len; i++) {
              if (result[i].download_progress != 100) {
                continue
              }

              find_iter = false

              for (var j = 0, len2 = already_download_list_data.length; j < len2; j++) {
                if (result[i].chat == already_download_list_data[j].chat && result[i].id == already_download_list_data[j].id) {
                  find_iter = true
                  break
                }
              }

              if (find_iter) {
                continue;
              }
              // not found
              obj = $('div[lay-id="already_download_list"]  .layui-table-body .layui-table tbody')
              var tr = ' <tr data-index="' + result[i].chat + '-' + result[i].id + '">' +
                '<td data-field="id" data-key="2-0-0" class=""><div class="layui-table-cell laytable-cell-2-0-0">' + result[i].id + '</div></td>' +
                '<td data-field="filename" data-key="2-0-1" class=""><div class="layui-table-cell laytable-cell-2-0-1" align="center">' + result[i].filename + '</div></td>' +
                '<td data-field="total_size" data-key="2-0-2" class=""><div class="layui-table-cell laytable-cell-2-0-2" align="center">' + result[i].total_size + '</div></td>' +
                '<td data-field="save_path" data-key="2-0-3" class=""><div class="layui-table-cell laytable-cell-2-0-3" align="center">' + result[i].save_path + '</div></td>' +
                "  </tr>";
              obj.append(tr)

              already_download_list_data.push(result[i])

              if (already_download_list_data.length == 1) {
                $(".layui-none").remove()
              }
              element.render()
            }

            element.render()
            render_downloaded_cards(already_download_list_data);
          }
        });

      };

      element.on('tab(telegram_media_downloader)', function (data) {
        if (data.index != 0) {
          clearInterval(update_download_list_int);
        }

        if (data.index == 0) {
          update_download_list_int = self.setInterval(update_download_list, 1000);
        }

        if (data.index != 1) {
          clearInterval(update_already_download_list_int);
        }

        if (data.index == 1) {
          update_already_download_list_int = self.setInterval(update_already_download_list, 1000);
        }

        if (data.index == 2 && !target_loaded) {
          load_dialogs(false);
        }

        if (data.index == 2) {
          start_target_progress_poll();
        } else {
          stop_target_progress_poll();
        }

      });

    });
  </script>
</body>
